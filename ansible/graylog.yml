---
# =============================================================
# PLAY 1 — Installation de Graylog 5.x avec Docker
# Compatible Debian 13 Trixie
# Cible : 192.168.56.12
# =============================================================

- name: Installation Graylog 5.x (db-server)
  hosts: dbservers
  become: yes

  vars:
    graylog_password_secret: "supersecretpasswordmin16chars!!"   # ⚠️ À CHANGER (min 16 chars)
    graylog_root_password: "admin"                               # ⚠️ Mot de passe UI
    mongodb_root_password: "yourmongodbpassword"                 # ⚠️ À CHANGER
    graylog_http_bind: "0.0.0.0:9000"
    opensearch_heap: "512m"
    opensearch_version: "2.13.0"

  tasks:

    # ── Prérequis système ──────────────────────────────────────

    - name: Mettre à jour la liste des paquets
      apt:
        update_cache: yes

    - name: Installer les dépendances système
      apt:
        name:
          - wget
          - curl
          - gnupg
          - ca-certificates
          - lsb-release
        state: present

    - name: Créer le répertoire /etc/apt/keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # ── Java (Temurin 17 via Adoptium) ─────────────────────────

    - name: Télécharger la clé GPG Adoptium
      get_url:
        url: https://packages.adoptium.net/artifactory/api/gpg/key/public
        dest: /etc/apt/keyrings/adoptium.asc
        mode: '0644'

    - name: Ajouter le dépôt Adoptium
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb {{ ansible_distribution_release }} main"
        state: present
        update_cache: yes

    - name: Installer OpenJDK 17 (Temurin)
      apt:
        name: temurin-17-jdk
        state: present

    # ── Docker ─────────────────────────────────────────────────

    - name: Supprimer les anciens paquets Docker conflictuels
      apt:
        name:
          - docker.io
          - docker-compose
          - docker-buildx
          - containerd
          - runc
        state: absent
        purge: yes
        autoremove: yes

    - name: Télécharger la clé GPG Docker
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Ajouter le dépôt Docker
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        update_cache: yes

    - name: Installer Docker et docker-compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Démarrer et activer Docker
      service:
        name: docker
        state: started
        enabled: yes

    # ── Nettoyage Docker (avant création du réseau) ────────────

    - name: Nettoyer le cache Docker (conteneurs/images orphelins)
      command: docker system prune -a -f
      ignore_errors: yes

    # ── Réseau Docker ──────────────────────────────────────────

    - name: Créer le réseau Docker graylog_network
      docker_network:
        name: graylog_network
        state: present

    # ── MongoDB via Docker ─────────────────────────────────────

    - name: Télécharger l'image MongoDB 7.0
      docker_image:
        name: mongo:7.0
        source: pull
        state: present

    - name: Lancer MongoDB en conteneur
      docker_container:
        name: mongodb
        image: mongo:7.0
        networks:
          - name: graylog_network
        ports:
          - "27017:27017"
        volumes:
          - /data/mongodb:/data/db
        restart_policy: always
        env:
          MONGO_INITDB_ROOT_USERNAME: "admin"
          MONGO_INITDB_ROOT_PASSWORD: "{{ mongodb_root_password }}"

    - name: Attendre que MongoDB soit prêt (port 27017)
      wait_for:
        host: 127.0.0.1
        port: 27017
        timeout: 60

    # ── OpenSearch via Docker ──────────────────────────────────

    - name: Créer le volume Docker pour OpenSearch
      docker_volume:
        name: opensearch_data
        state: present

    - name: Télécharger l'image OpenSearch
      docker_image:
        name: "opensearchproject/opensearch:{{ opensearch_version }}"
        source: pull
        state: present

    - name: Lancer OpenSearch en conteneur
      docker_container:
        name: opensearch
        image: "opensearchproject/opensearch:{{ opensearch_version }}"
        networks:
          - name: graylog_network
        ports:
          - "9200:9200"
        volumes:
          - opensearch_data:/usr/share/opensearch/data
        restart_policy: always
        env:
          OPENSEARCH_JAVA_OPTS: "-Xms{{ opensearch_heap }} -Xmx{{ opensearch_heap }}"
          bootstrap.memory_lock: "true"
          discovery.type: "single-node"
          action.auto_create_index: "false"
          plugins.security.disabled: "true"
        ulimits:
          - "memlock:-1:-1"
          - "nofile:65536:65536"

    - name: Attendre qu'OpenSearch soit prêt (port 9200)
      wait_for:
        host: 127.0.0.1
        port: 9200
        timeout: 120

    # ── Graylog (paquet natif) ─────────────────────────────────

    - name: Télécharger le paquet .deb du dépôt Graylog 5.2
      get_url:
        url: https://packages.graylog2.org/repo/packages/graylog-5.2-repository_latest.deb
        dest: /tmp/graylog-repo.deb
        mode: '0755'

    - name: Installer le dépôt Graylog via le .deb
      apt:
        deb: /tmp/graylog-repo.deb
        update_cache: yes

    - name: Installer Graylog
      apt:
        name: graylog-server
        state: present

    - name: Générer le hash SHA2 du mot de passe root
      command: "echo -n {{ graylog_root_password }} | sha256sum | awk '{print $1}'"
      register: graylog_root_password_sha2
      changed_when: false

    - name: Configurer Graylog (server.conf)
      lineinfile:
        path: /etc/graylog/server/server.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^password_secret',    line: 'password_secret = {{ graylog_password_secret }}' }
        - { regexp: '^root_password_sha2', line: 'root_password_sha2 = {{ graylog_root_password_sha2.stdout }}' }
        - { regexp: '^http_bind_address',  line: 'http_bind_address = {{ graylog_http_bind }}' }
        - { regexp: '^elasticsearch_hosts', line: 'elasticsearch_hosts = http://127.0.0.1:9200' }
        - { regexp: '^mongodb_uri',        line: 'mongodb_uri = mongodb://admin:{{ mongodb_root_password }}@127.0.0.1:27017/graylog?authSource=admin' }

    - name: Démarrer et activer Graylog
      service:
        name: graylog-server
        state: started
        enabled: yes

    - name: Attendre que Graylog soit prêt (port 9000)
      wait_for:
        host: 0.0.0.0
        port: 9000
        timeout: 90

    - name: Ouvrir les ports firewall
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "5044"
        - "9000"
      ignore_errors: yes

# =============================================================
# PLAY 2 — Filebeat sur le web-server (Nginx)
# Cible : 192.168.56.11
# =============================================================

- name: Installation Filebeat sur le web-server (Nginx)
  hosts: webservers
  become: yes

  vars:
    graylog_host: "192.168.56.12"
    graylog_beats_port: 5044

  tasks:

    - name: Installer les dépendances Filebeat
      apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
        state: present

    - name: Créer le répertoire /etc/apt/keyrings (web-server)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Télécharger la clé GPG Elastic (web-server)
      get_url:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        dest: /etc/apt/keyrings/elastic.asc
        mode: '0644'

    - name: Ajouter le dépôt Filebeat (web-server)
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/elastic.asc] https://artifacts.elastic.co/packages/8.x/apt stable main"
        state: present
        filename: elastic-8
        update_cache: yes

    - name: Installer Filebeat (web-server)
      apt:
        name: filebeat
        state: present

    - name: Configurer Filebeat → Nginx vers Graylog
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
            - type: log
              enabled: true
              paths:
                - /var/log/nginx/access.log
                - /var/log/nginx/error.log
              fields:
                service: nginx
                server: web-server
              fields_under_root: true

          output.logstash:
            hosts: ["{{ graylog_host }}:{{ graylog_beats_port }}"]

          logging.level: warning

    - name: Démarrer et activer Filebeat (web-server)
      service:
        name: filebeat
        state: started
        enabled: yes

# =============================================================
# PLAY 3 — Filebeat sur le db-server (MariaDB)
# Cible : 192.168.56.12
# =============================================================

- name: Installation Filebeat sur le db-server (MariaDB)
  hosts: dbservers
  become: yes

  vars:
    graylog_host: "127.0.0.1"
    graylog_beats_port: 5044

  tasks:

    - name: Installer Filebeat (db-server)
      apt:
        name: filebeat
        state: present

    - name: Activer les logs généraux MariaDB
      blockinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        block: |
          general_log = 1
          general_log_file = /var/log/mysql/mysql.log
        marker: "# {mark} ANSIBLE MANAGED — GENERAL LOG"
      notify: Restart MariaDB

    - name: Créer le dossier /var/log/mysql
      file:
        path: /var/log/mysql
        state: directory
        owner: mysql
        group: adm
        mode: '0750'

    - name: Configurer Filebeat → MariaDB vers Graylog
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
            - type: log
              enabled: true
              paths:
                - /var/log/mysql/mysql.log
                - /var/log/mysql/error.log
              fields:
                service: mariadb
                server: db-server
              fields_under_root: true

          output.logstash:
            hosts: ["{{ graylog_host }}:{{ graylog_beats_port }}"]

          logging.level: warning

    - name: Démarrer et activer Filebeat (db-server)
      service:
        name: filebeat
        state: started
        enabled: yes

  handlers:
    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted
