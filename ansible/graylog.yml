---
# =============================================================
# PLAY 1 — Installation de Graylog 5.x avec Docker (MongoDB + OpenSearch)
# Compatible Debian 12/13 — Cible : 192.168.56.12
# =============================================================
- name: Installation Graylog 5.x (db-server)
  hosts: dbservers
  become: yes
  vars:
    graylog_password_secret: "supersecretpasswordmin16chars!!"  # ⚠️ À CHANGER (min 16 caractères)
    graylog_root_password: "admin"                              # Mot de passe UI par défaut
    graylog_http_bind: "0.0.0.0:9000"
    opensearch_heap: "512m"
    mongodb_root_password: "yourmongodbpassword"               # ⚠️ À CHANGER
    opensearch_version: "2.13.0"
    # Utilisation de OpenJDK 11 (disponible par défaut sur Debian 12/13)
    java_package: "openjdk-11-jre-headless"

  tasks:
    # =========================================
    # 1. PRÉREQUIS SYSTÈME + DOCKER
    # =========================================
    - name: Mettre à jour la liste des paquets
      apt:
        update_cache: yes

    - name: Installer les dépendances système
      apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
          - pwgen
          - "{{ java_package }}"  # Java 11 au lieu de 17
          - ca-certificates
        state: present

    - name: Ajouter le dépôt Docker officiel
      block:
        - name: Installer les dépendances pour Docker
          apt:
            name:
              - gnupg
              - lsb-release
            state: present

        - name: Ajouter la clé GPG de Docker
          apt_key:
            url: https://download.docker.com/linux/debian/gpg
            state: present

        - name: Ajouter le dépôt Docker
          apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
            state: present
            update_cache: yes

    - name: Installer Docker et docker-compose
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Vérifier que Docker est actif
      service:
        name: docker
        state: started
        enabled: yes

    # =========================================
    # 2. RÉSEAU DOCKER POUR GRAYLOG
    # =========================================
    - name: Créer un réseau Docker dédié à Graylog
      docker_network:
        name: graylog_network
        state: present

    # =========================================
    # 3. MONGODB VIA DOCKER
    # =========================================
    - name: Lancer MongoDB en conteneur
      docker_container:
        name: mongodb
        image: mongo:7.0
        networks:
          - name: graylog_network
        ports: "27017:27017"
        volumes: "/data/mongodb:/data/db"
        restart_policy: always
        env:
          MONGO_INITDB_ROOT_USERNAME: "admin"
          MONGO_INITDB_ROOT_PASSWORD: "{{ mongodb_root_password }}"

    - name: Attendre que MongoDB soit prêt
      wait_for:
        host: 127.0.0.1
        port: 27017
        timeout: 60

    # =========================================
    # 4. OPENSEARCH VIA DOCKER
    # =========================================
    - name: Télécharger l'image OpenSearch
      docker_image:
        name: "opensearchproject/opensearch:{{ opensearch_version }}"
        source: pull
        state: present

    - name: Créer un volume Docker pour OpenSearch
      docker_volume:
        name: opensearch_data
        state: present

    - name: Lancer OpenSearch en conteneur
      docker_container:
        name: opensearch
        image: "opensearchproject/opensearch:{{ opensearch_version }}"
        networks:
          - name: graylog_network
        ports: "9200:9200"
        volumes: "opensearch_data:/usr/share/opensearch/data"
        restart_policy: always
        env:
          OPENSEARCH_JAVA_OPTS: "-Xms{{ opensearch_heap }} -Xmx{{ opensearch_heap }}"
          bootstrap.memory_lock: "true"
          discovery.type: "single-node"
          action.auto_create_index: "false"
          plugins.security.disabled: "true"
        ulimits:
          - "memlock:-1:-1"
          - "nofile:65536:65536"

    - name: Attendre qu'OpenSearch soit prêt
      wait_for:
        host: 127.0.0.1
        port: 9200
        timeout: 120

    # =========================================
    # 5. INSTALLATION DE GRAYLOG (méthode manuelle)
    # =========================================
    - name: Télécharger le fichier .deb du dépôt Graylog
      get_url:
        url: "https://packages.graylog2.org/repo/packages/graylog-5.2-repository_latest.deb"
        dest: "/tmp/graylog-repo.deb"
        mode: '0755'

    - name: Installer le dépôt Graylog via le fichier .deb
      apt:
        deb: "/tmp/graylog-repo.deb"
        update_cache: yes

    - name: Installer Graylog
      apt:
        name: graylog-server
        state: present

    - name: Générer le hash SHA2 du mot de passe root
      command: "echo -n {{ graylog_root_password }} | sha256sum | awk '{print $1}'"
      register: graylog_root_password_sha2
      changed_when: false

    - name: Configurer Graylog (server.conf)
      lineinfile:
        path: /etc/graylog/server/server.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^password_secret', line: 'password_secret = {{ graylog_password_secret }}' }
        - { regexp: '^root_password_sha2', line: 'root_password_sha2 = {{ graylog_root_password_sha2.stdout }}' }
        - { regexp: '^http_bind_address', line: 'http_bind_address = {{ graylog_http_bind }}' }
        - { regexp: '^elasticsearch_hosts', line: 'elasticsearch_hosts = http://127.0.0.1:9200' }
        - { regexp: '^mongodb_uri', line: 'mongodb_uri = mongodb://admin:{{ mongodb_root_password }}@127.0.0.1:27017/graylog?authSource=admin' }

    - name: Démarrer et activer Graylog
      service:
        name: graylog-server
        state: started
        enabled: yes

    - name: Attendre que Graylog soit prêt
      wait_for:
        host: 0.0.0.0
        port: 9000
        timeout: 90

    - name: Ouvrir les ports firewall pour Graylog
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "5044"  # Port pour les inputs Beats
        - "9000"  # Port de l'UI Graylog
      ignore_errors: yes

# =============================================================
# PLAY 2 — Installation de Filebeat sur le web-server (Nginx)
# Cible : 192.168.56.11
# =============================================================
- name: Installation Filebeat sur le web-server (Nginx)
  hosts: webservers
  become: yes
  vars:
    graylog_host: "192.168.56.12"
    graylog_beats_port: 5044

  tasks:
    - name: Installer les dépendances pour Filebeat
      apt:
        name:
          - apt-transport-https
          - gnupg
          - curl
        state: present

    - name: Télécharger la clé GPG Elastic
      get_url:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        dest: /etc/apt/keyrings/elastic.asc
        mode: '0644'

    - name: Ajouter le dépôt Filebeat
      apt_repository:
        repo: "deb [ signed-by=/etc/apt/keyrings/elastic.asc ] https://artifacts.elastic.co/packages/8.x/apt stable main"
        state: present
        filename: elastic-8

    - name: Installer Filebeat
      apt:
        name: filebeat
        state: present
        update_cache: yes

    - name: Configurer Filebeat pour envoyer les logs Nginx à Graylog
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
            - type: log
              enabled: true
              paths:
                - /var/log/nginx/access.log
                - /var/log/nginx/error.log
              fields:
                service: nginx
                server: web-server
              fields_under_root: true
          output.logstash:
            hosts: ["{{ graylog_host }}:{{ graylog_beats_port }}"]
          logging.level: warning

    - name: Démarrer et activer Filebeat
      service:
        name: filebeat
        state: started
        enabled: yes

# =============================================================
# PLAY 3 — Installation de Filebeat sur le db-server (MariaDB)
# Cible : 192.168.56.12
# =============================================================
- name: Installation Filebeat sur le db-server (MariaDB)
  hosts: dbservers
  become: yes
  vars:
    graylog_host: "127.0.0.1"
    graylog_beats_port: 5044

  tasks:
    - name: Installer Filebeat
      apt:
        name: filebeat
        state: present
        update_cache: yes

    - name: Activer les logs généraux MariaDB
      blockinfile:
        path: /etc/mysql/mariadb.conf.d/50-server.cnf
        block: |
          general_log = 1
          general_log_file = /var/log/mysql/mysql.log
        marker: "# {mark} ANSIBLE MANAGED — GENERAL LOG"
      notify: Restart MariaDB

    - name: Créer le dossier /var/log/mysql
      file:
        path: /var/log/mysql
        state: directory
        owner: mysql
        group: adm
        mode: '0750'

    - name: Configurer Filebeat pour envoyer les logs MariaDB à Graylog
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
            - type: log
              enabled: true
              paths:
                - /var/log/mysql/mysql.log
                - /var/log/mysql/error.log
              fields:
                service: mariadb
                server: db-server
              fields_under_root: true
          output.logstash:
            hosts: ["{{ graylog_host }}:{{ graylog_beats_port }}"]
          logging.level: warning

    - name: Démarrer et activer Filebeat
      service:
        name: filebeat
        state: started
        enabled: yes

  handlers:
    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted
