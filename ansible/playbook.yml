---
- name: Configurer le serveur web
  hosts: web-se
  become: true

  tasks:
    - name: Mettre à jour apt
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Installer nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Démarrer et activer nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes

    - name: Déployer la page d'accueil
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Déploiement automatique</title>
          </head>
          <body>
            <h1>Déployé automatiquement</h1>
            <p>Pipeline Jenkins + Ansible + VMware</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'


- name: Configurer le serveur de base de données
  hosts: deb-se
  become: true

  vars:
    postgres_conf_path: "/etc/postgresql/15/main"

  tasks:
    - name: Installer PostgreSQL
      ansible.builtin.apt:
        name: postgresql
        state: present
        update_cache: yes

    - name: Démarrer et activer PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes

    - name: Autoriser les connexions distantes (postgresql.conf)
      ansible.builtin.lineinfile:
        path: "{{ postgres_conf_path }}/postgresql.conf"
        regexp: '^#?listen_addresses'
        line: "listen_addresses = '*'"
        backup: yes
      notify: Restart PostgreSQL

    - name: Autoriser les connexions (pg_hba.conf)
      ansible.builtin.lineinfile:
        path: "{{ postgres_conf_path }}/pg_hba.conf"
        line: "host all all 0.0.0.0/0 md5"
        create: yes
        backup: yes
      notify: Restart PostgreSQL

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted
