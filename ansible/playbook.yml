---
- name: Déploiement serveur web
  hosts: webservers
  become: yes

  tasks:
    - name: Mettre à jour les paquets
      apt:
        update_cache: yes

    - name: Installer nginx
      apt:
        name: nginx
        state: present

    - name: S'assurer que nginx est démarré
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Créer le dossier web si absent
      file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - name: Déployer une page web simple
      copy:
        dest: /var/www/html/index.html
        content: "<h1>Déploiement réussi 🚀</h1>"

# ----------------------------------------

- name: Déploiement base de données
  hosts: dbservers
  become: yes

  tasks:
    - name: Mettre à jour les paquets
      apt:
        update_cache: yes

    - name: Installer MySQL
      apt:
        name: mysql-server
        state: present

    - name: S'assurer que MySQL est démarré
      service:
        name: mysql
        state: started
        enabled: yes
