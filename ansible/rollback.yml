# =============================================================
# PLAY 1 — Rollback serveur web
# Cible : 192.168.56.11
# =============================================================
- name: Rollback serveur web
  hosts: webservers
  become: yes
  tasks:
    - name: Installer Nginx
      apt:
        name: nginx
        state: present

    - name: Remettre la page par défaut
      copy:
        content: "<h1>Rollback effectué</h1>"
        dest: /var/www/html/index.html

    - name: Démarrer Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Vérifier si Filebeat est installé
      stat:
        path: /usr/bin/filebeat
      register: filebeat_bin

    - name: Redémarrer Filebeat
      service:
        name: filebeat
        state: restarted
      when: filebeat_bin.stat.exists

# =============================================================
# PLAY 2 — Rollback base de données
# Cible : 192.168.56.12
# =============================================================
- name: Rollback base de données
  hosts: dbservers
  become: yes
  tasks:
    - name: Installer MariaDB
      apt:
        name: mariadb-server
        state: present

    - name: Démarrer MariaDB
      service:
        name: mariadb
        state: started
        enabled: yes

    # ── Rollback Docker (MongoDB + OpenSearch) ─────────────────────────────
    - name: Vérifier si MongoDB existe
      command: docker inspect mongodb
      register: mongodb_container
      ignore_errors: yes
      changed_when: false

    - name: Arrêter/supprimer MongoDB
      docker_container:
        name: mongodb
        state: absent
      when: mongodb_container.rc == 0

    - name: Vérifier si OpenSearch existe
      command: docker inspect opensearch
      register: opensearch_container
      ignore_errors: yes
      changed_when: false

    - name: Arrêter/supprimer OpenSearch
      docker_container:
        name: opensearch
        state: absent
      when: opensearch_container.rc == 0

    - name: Supprimer le réseau Docker
      docker_network:
        name: graylog_network
        state: absent
      ignore_errors: yes

    - name: Supprimer les volumes Docker
      docker_volume:
        name: "{{ item }}"
        state: absent
      loop:
        - opensearch_data
        - mongodb_data  # Si vous l'aviez créé
      ignore_errors: yes

    # ── Rollback Graylog/Filebeat ──────────────────────────────────────────
    - name: Vérifier si Graylog est installé
      stat:
        path: /usr/share/graylog-server/bin/graylog
      register: graylog_bin

    - name: Arrêter Graylog
      service:
        name: graylog-server
        state: stopped
      when: graylog_bin.stat.exists

    - name: Vérifier si Filebeat est installé
      stat:
        path: /usr/bin/filebeat
      register: filebeat_db_bin

    - name: Redémarrer Filebeat
      service:
        name: filebeat
        state: restarted
      when: filebeat_db_bin.stat.exists

    - name: Résumé du rollback
      debug:
        msg: |
          Rollback terminé :
          - MariaDB : actif
          - Conteneurs supprimés : MongoDB ({{ mongodb_container.rc == 0 }}), OpenSearch ({{ opensearch_container.rc == 0 }})
          - Graylog installé : {{ graylog_bin.stat.exists }}
          - Filebeat installé : {{ filebeat_db_bin.stat.exists }}
