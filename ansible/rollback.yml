---
# =============================================================
# PLAY 1 — Rollback serveur web
# Cible : 192.168.56.11
# =============================================================

- name: Rollback serveur web
  hosts: webservers
  become: yes
  tasks:

    - name: Installer nginx si absent
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Créer le dossier web si absent
      file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - name: Remettre la page par défaut nginx
      copy:
        content: "<h1>Rollback effectué</h1>"
        dest: /var/www/html/index.html

    - name: S'assurer que nginx est démarré
      service:
        name: nginx
        state: started
        enabled: yes

    # ── Rollback Filebeat (web-server) ────────────────────────

    - name: Vérifier si Filebeat est installé (web-server)
      stat:
        path: /usr/bin/filebeat
      register: filebeat_web_bin

    - name: Redémarrer Filebeat si présent (web-server)
      service:
        name: filebeat
        state: restarted
        enabled: yes
      when: filebeat_web_bin.stat.exists
      ignore_errors: yes

# =============================================================
# PLAY 2 — Rollback base de données
# Cible : 192.168.56.12
# =============================================================

- name: Rollback base de données
  hosts: dbservers
  become: yes
  tasks:

    - name: Installer MariaDB si absent
      apt:
        name: mariadb-server
        state: present
        update_cache: yes

    - name: S'assurer que MariaDB est démarré
      service:
        name: mariadb
        state: started
        enabled: yes

    # ── Rollback stack Graylog ────────────────────────────────

    - name: Vérifier si Graylog est installé
      stat:
        path: /usr/share/graylog-server/bin/graylog
      register: graylog_bin

    - name: Vérifier si OpenSearch est installé
      stat:
        path: /usr/share/opensearch/bin/opensearch
      register: opensearch_bin

    - name: Vérifier si MongoDB est installé (paquet natif Debian)
      stat:
        path: /usr/bin/mongod
      register: mongod_bin

    - name: Arrêter Graylog proprement
      service:
        name: graylog-server
        state: stopped
      when: graylog_bin.stat.exists
      ignore_errors: yes

    - name: Arrêter OpenSearch proprement
      service:
        name: opensearch
        state: stopped
      when: opensearch_bin.stat.exists
      ignore_errors: yes

    - name: Arrêter MongoDB proprement
      service:
        name: mongodb
        state: stopped
      when: mongod_bin.stat.exists
      ignore_errors: yes

    - name: Redémarrer MongoDB
      service:
        name: mongodb
        state: started
        enabled: yes
      when: mongod_bin.stat.exists
      ignore_errors: yes

    - name: Attendre que MongoDB soit prêt (port 27017)
      wait_for:
        port: 27017
        host: 127.0.0.1
        timeout: 30
      when: mongod_bin.stat.exists
      ignore_errors: yes

    - name: Redémarrer OpenSearch
      service:
        name: opensearch
        state: started
        enabled: yes
      when: opensearch_bin.stat.exists
      ignore_errors: yes

    - name: Attendre qu'OpenSearch soit prêt (port 9200)
      wait_for:
        port: 9200
        host: 127.0.0.1
        timeout: 60
      when: opensearch_bin.stat.exists
      ignore_errors: yes

    - name: Redémarrer Graylog
      service:
        name: graylog-server
        state: started
        enabled: yes
      when: graylog_bin.stat.exists
      ignore_errors: yes

    - name: Attendre que Graylog soit prêt (port 9000)
      wait_for:
        port: 9000
        host: 0.0.0.0
        timeout: 90
      when: graylog_bin.stat.exists
      ignore_errors: yes

    # ── Rollback Filebeat (db-server) ─────────────────────────

    - name: Vérifier si Filebeat est installé (db-server)
      stat:
        path: /usr/bin/filebeat
      register: filebeat_db_bin

    - name: Redémarrer Filebeat si présent (db-server)
      service:
        name: filebeat
        state: restarted
        enabled: yes
      when: filebeat_db_bin.stat.exists
      ignore_errors: yes

    - name: Résumé rollback db-server
      debug:
        msg: |
          Rollback db-server terminé.
          MariaDB : toujours actif.
          Graylog installé : {{ graylog_bin.stat.exists }}
          OpenSearch installé : {{ opensearch_bin.stat.exists }}
          MongoDB installé : {{ mongod_bin.stat.exists }}
          Filebeat installé : {{ filebeat_db_bin.stat.exists }}
